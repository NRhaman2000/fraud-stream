global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: model-api
    static_configs:
      - targets: ["model-api:8001"]
  - job_name: scorer
    static_configs:
      - targets: ["scorer:9101"]
  - job_name: dashboard
    static_configs:
      - targets: ["dashboard:8000"]
  - job_name: producer   # only up while `make demo` runs
    static_configs:
      - targets: ["producer:9102"]
