[project]
name = "fraud-services"
version = "0.1.0"
description = "Runtime services: model API, stream scorer, transaction producer, dashboard."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fraud-common",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.28,<1",
    "prometheus-client>=0.21,<1",
    "pyarrow>=18",
    "psycopg-pool>=3.2,<4",
]

[tool.uv.sources]
fraud-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_services"]
