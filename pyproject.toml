[project]
name = "fraud-stream"
version = "0.1.0"
description = "Real-time card fraud detection: Kafka stream, FastAPI-served XGBoost scoring, live dashboard."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["fraud-common", "fraud-training", "fraud-services"]

[tool.uv]
package = false

[tool.uv.sources]
fraud-common = { workspace = true }
fraud-training = { workspace = true }
fraud-services = { workspace = true }

[tool.uv.workspace]
members = ["libs/*", "training", "services"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "pandas-stubs>=2.2",
]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs/fraud_common/src", "training/src", "services/src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PT", "PL", "TRY", "ERA",
]
ignore = ["TRY003", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.format]
quote-style = "double"

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "libs/fraud_common/src:training/src:services/src"
files = ["libs/fraud_common/src", "training/src", "services/src", "tests"]
plugins = ["pydantic.mypy"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
markers = ["integration: needs the docker compose stack running (make up)"]
filterwarnings = [
    "error",
    # Starlette's TestClient prefers the httpx2 fork; httpx 0.28 is still supported.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["fraud_common", "fraud_training", "fraud_services"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
